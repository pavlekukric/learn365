name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm validate-content

      - name: Generated content is current
        # Phase 10: _generated.ts + _generated.articles.ts must be exactly what
        # `pnpm gen-content` produces from content/courses/**. `add -N` makes a
        # brand-new generated file show up in the diff too.
        run: |
          pnpm gen-content
          git add -N packages/content/src/courses
          if ! git diff --quiet -- packages/content/src/courses; then
            echo "::error::packages/content/src/courses/**/_generated*.ts is stale — run 'pnpm gen-content' and commit the result."
            git --no-pager diff --stat -- packages/content/src/courses
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget
        # Phase 9: every route ≤ 175 kB gzip client JS, every chunk ≤ 300 kB raw.
        run: pnpm --filter @learn365/web check-bundle
