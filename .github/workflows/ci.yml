name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Review 2026-10-03 P2 10: least privilege — every job only reads the repo.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (warn-only)
        # Review 2026-10-03 P2 10: a signal, not a gate. On 2026-10-03 it lists
        # 4 high + 2 moderate, all build-time postcss / nanoid inside `next`,
        # unreachable from request traffic. Dependabot (.github/dependabot.yml)
        # proposes the fixes.
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Validate content
        run: pnpm validate-content

      - name: Generated content is current
        # Phase 10: _generated.ts + _generated.articles.ts must be exactly what
        # `pnpm gen-content` produces from content/courses/**. `add -N` makes a
        # brand-new generated file show up in the diff too.
        run: |
          pnpm gen-content
          git add -N packages/content/src/courses
          if ! git diff --quiet -- packages/content/src/courses; then
            echo "::error::packages/content/src/courses/**/_generated*.ts is stale — run 'pnpm gen-content' and commit the result."
            git --no-pager diff --stat -- packages/content/src/courses
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget
        # Phase 9: every route ≤ 175 kB gzip client JS, every chunk ≤ 300 kB raw.
        run: pnpm --filter @learn365/web check-bundle

  e2e:
    # Phase 10: the browser suite, in parallel with `validate` (its own build —
    # 22 s on the runner, cheaper than shipping .next as an artifact). Chromium
    # only; Firefox / WebKit run nightly (e2e-nightly.yml).
    # Review 2026-09-30 item 19: besides the accounts-off suite, the axe pass
    # (desktop + mobile) and the accounts-on project — a second `next start`
    # on a seeded PGlite database, configured in playwright.config.ts.
    name: E2E (Chromium desktop + mobile, a11y, accounts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @learn365/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Playwright
        run: >-
          pnpm --filter @learn365/web exec playwright test
          --project=chromium-desktop --project=chromium-mobile
          --project=a11y-desktop --project=a11y-mobile
          --project=accounts-chromium

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
