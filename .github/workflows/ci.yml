name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Review 2026-10-03 P2 10: least privilege — every job only reads the repo.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (warn-only)
        # Review 2026-10-03 P2 10: a signal, not a gate. On 2026-10-03 it lists
        # 4 high + 2 moderate, all build-time postcss / nanoid inside `next`,
        # unreachable from request traffic. Dependabot (.github/dependabot.yml)
        # proposes the fixes.
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Validate content
        run: pnpm validate-content

      - name: Generated content is current
        # Phase 10: _generated.ts + _generated.articles.ts must be exactly what
        # `pnpm gen-content` produces from content/courses/**. `add -N` makes a
        # brand-new generated file show up in the diff too. lesson-dates.json
        # is written by the same run; a date moves only when that lesson's
        # JSON moved, so re-running it here on another day changes nothing.
        run: |
          pnpm gen-content
          git add -N packages/content/src/courses content/courses
          if ! git diff --quiet -- packages/content/src/courses 'content/courses/*/lesson-dates.json'; then
            echo "::error::_generated*.ts or lesson-dates.json is stale — run 'pnpm gen-content' and commit the result."
            git --no-pager diff --stat -- packages/content/src/courses 'content/courses/*/lesson-dates.json'
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget
        # Phase 9: every route ≤ 175 kB gzip client JS, every chunk ≤ 300 kB raw.
        run: pnpm --filter @learn365/web check-bundle

  e2e:
    # Phase 10: the browser suite, in parallel with `validate` (its own build —
    # 22 s on the runner, cheaper than shipping .next as an artifact). Chromium
    # only; Firefox / WebKit run nightly (e2e-nightly.yml).
    # Review 2026-09-30 item 19: besides the accounts-off suite, the axe pass
    # (desktop + mobile) and the accounts-on project — a second `next start`
    # on a seeded PGlite database, configured in playwright.config.ts.
    name: E2E (Chromium desktop + mobile, a11y, accounts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @learn365/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Playwright
        run: >-
          pnpm --filter @learn365/web exec playwright test
          --project=chromium-desktop --project=chromium-mobile
          --project=a11y-desktop --project=a11y-mobile
          --project=accounts-chromium

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
