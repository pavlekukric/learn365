name: Deploy

# Builds the apps/web Docker image and rolls it out to the VPS (deploy/).
# - workflow_run (CI completed for a push to main, success only — Phase 10):
#   build, push to GHCR, then ssh `deploy.sh <tag>`. The commit built is the
#   one CI validated (workflow_run.head_sha), not the tip of main. A red CI
#   deploys nothing; the previous image stays live.
# - pull_request touching deploy files: build only (validates the Dockerfile).
# - manual run (workflow_dispatch): build + rollout of HEAD of main WITHOUT
#   waiting for CI — the emergency bypass. Refused for any other branch.
# - Only the tip of main is ever rolled out (2026-09-30 review, P0 item 3): a
#   re-run of an older commit's CI (the next/font flake fix) goes green again,
#   but the rollout step sees main has moved on and skips — no silent rollback.
# - `:latest` moves only forward (review 2026-10-03 P2 10): it is pushed only on a
#   green-CI run (workflow_run) whose commit is still the tip of main. A re-run of an
#   older commit, or the manual bypass, pushes `sha-<12>` alone. Nothing rolls out
#   `:latest` (deploy.sh always names `sha-<12>`); it is the compose fallback a fresh
#   box starts on (vps-install.sh writes IMAGE_TAG=latest) before its first rollout.
# The deploy job is a no-op until the DEPLOY_* secrets exist (see docs/DEPLOY.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - 'apps/web/next.config.mjs'
  workflow_dispatch:

# Least privilege (review 2026-10-03 P2 10): nothing by default; each job asks for its own.
permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/learn365-web
  # The commit to build: the one CI just validated (workflow_run), else this run's own.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    name: Build image
    # Phase 10: on workflow_run, only after a green CI for a push to main.
    # PR (build-only) and manual runs are unconditional, as before.
    if: >-
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sha-${SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$tag"
            # `:latest` only for a CI-validated commit that is still the tip of main.
            if [ "$GITHUB_EVENT_NAME" = workflow_run ] &&
              [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
              echo "$IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Only the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "main is at $tip, this run built $SHA — rollout skipped (the newer commit deploys itself)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll out over SSH
        if: steps.tip.outputs.skip != '1'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY not set — image pushed, rollout skipped."
            exit 0
          fi
          if [ -z "$HOST_KEY" ]; then
            echo "DEPLOY_HOST_KEY variable not set (pinned host key) — refusing to connect blind."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key instead of ssh-keyscan: keyscan opens one connection per
          # key type and trips the VPS's `ufw limit` on port 22 (6 hits / 30 s),
          # after which the real ssh below is dropped. One connection per rollout.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "${USER:-deploy}@$HOST" "bash /srv/learn365/deploy.sh $TAG"
