name: Deploy

# Builds the apps/web Docker image and rolls it out to the VPS (deploy/).
# - workflow_run (CI completed for a push to main, success only — Phase 10):
#   build, push to GHCR, then ssh `deploy.sh <tag>`. The commit built is the
#   one CI validated (workflow_run.head_sha), not the tip of main. A red CI
#   deploys nothing; the previous image stays live.
# - pull_request touching deploy files: build only (validates the Dockerfile).
# - manual run (workflow_dispatch): build + rollout of HEAD of main WITHOUT
#   waiting for CI — the emergency bypass. Refused for any other branch.
# - Only the tip of main is ever rolled out (2026-09-30 review, P0 item 3): a
#   re-run of an older commit's CI (the next/font flake fix) goes green again,
#   but the rollout step sees main has moved on and skips — no silent rollback.
# The deploy job is a no-op until the DEPLOY_* secrets exist (see docs/DEPLOY.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - 'apps/web/next.config.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/learn365-web
  # The commit to build: the one CI just validated (workflow_run), else this run's own.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    name: Build image
    # Phase 10: on workflow_run, only after a green CI for a push to main.
    # PR (build-only) and manual runs are unconditional, as before.
    if: >-
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: meta
        run: echo "tag=sha-${SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Only the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "main is at $tip, this run built $SHA — rollout skipped (the newer commit deploys itself)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll out over SSH
        if: steps.tip.outputs.skip != '1'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY not set — image pushed, rollout skipped."
            exit 0
          fi
          if [ -z "$HOST_KEY" ]; then
            echo "DEPLOY_HOST_KEY variable not set (pinned host key) — refusing to connect blind."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key instead of ssh-keyscan: keyscan opens one connection per
          # key type and trips the VPS's `ufw limit` on port 22 (6 hits / 30 s),
          # after which the real ssh below is dropped. One connection per rollout.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "${USER:-deploy}@$HOST" "bash /srv/learn365/deploy.sh $TAG"
