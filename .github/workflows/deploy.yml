name: Deploy

# Builds the apps/web Docker image and rolls it out to the VPS (deploy/).
# - pull_request touching deploy files: build only (validates the Dockerfile).
# - push to main / manual run: build, push to GHCR, then ssh `deploy.sh <tag>`.
# The deploy job is a no-op until the DEPLOY_* secrets exist (see docs/DEPLOY.md).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - 'apps/web/next.config.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/learn365-web

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Roll out over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY not set — image pushed, rollout skipped."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "${USER:-deploy}@$HOST" "bash /srv/learn365/deploy.sh $TAG"
