name: E2E nightly (Firefox + WebKit)

# Review 2026-09-30 item 19: the browser suite on the engines CI does not
# gate on. Every PR and push already runs Chromium desktop + mobile (ci.yml);
# this runs the same specs on Firefox desktop, Safari desktop and iPhone
# once a night against `main`. Not a merge gate: a red run is a signal to
# look, not a blocked deploy. Run by hand from the Actions tab
# (workflow_dispatch) after touching layout- or engine-sensitive code.

on:
  schedule:
    # 02:30 UTC = 03:30 / 04:30 in Belgrade, clear of the 03:15 backup on the box.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            projects: --project=firefox-desktop
          - browser: webkit
            projects: --project=webkit-desktop --project=webkit-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @learn365/web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: pnpm build

      - name: Playwright
        run: pnpm --filter @learn365/web exec playwright test ${{ matrix.projects }}

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
