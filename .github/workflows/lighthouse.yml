name: Lighthouse

# Review 2026-10-01 P1 item 3: mobile Lighthouse on Home, the course overview
# and Day 1 — warn-only (a `::warning::` and the job summary under 82), never
# red: runner timings drift. The hard font-preload and JS budgets are in
# `check-bundle` (ci.yml).
# Review 2026-10-03 P2 10: its own workflow, off the deploy path. Deploy
# (deploy.yml, `workflow_run` on CI) waits for the whole CI workflow, and this
# 3½-minute job was its slowest part. It still runs on every PR, and nightly
# against `main`; run it by hand from the Actions tab (workflow_dispatch).

on:
  pull_request:
  schedule:
    # 02:00 UTC, before e2e-nightly (02:30) and clear of the 03:15 backup on the box.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lighthouse:
    name: Lighthouse mobile (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @learn365/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Lighthouse
        run: pnpm --filter @learn365/web lighthouse
